controller_manager:
  ros__parameters:

    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # same JTC controller but with different custom name so we can seperate give hardware interface to gripper joints
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController



joint_trajectory_controller:
  ros__parameters:

    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_prism

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity


gripper_controller:
  ros__parameters:
    joints:
      - joint_5
    command_interfaces:
      - position
    state_interfaces:
      - velocity
      - position
    allow_nonzero_velocity_at_trajectory_end: true